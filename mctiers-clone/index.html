<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blade Tiers - Rankings</title>
  <meta name="description" content="Blade Tiers - Official competitive Minecraft combat rankings and player tier lists for chocomc.net">
  <link rel="icon" type="image/webp" href="assets/branding/blade_tier_icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Navbar -->
    <header class="navbar">
      <a href="#/rankings/overall" class="nav-brand">
        <img src="assets/branding/blade_tier_logo.png" alt="Blade Tiers Logo">
      </a>

      <ul class="nav-links">
        <li>
          <a href="#/rankings/overall" class="nav-link active" id="nav-rankings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/>
            </svg>
            <span>Rankings</span>
          </a>
        </li>
        <li class="nav-dropdown">
          <div class="nav-link" id="discords-dropdown-btn">
            <img src="assets/nav_icons/discord.svg" alt="Discords">
            <span>Discords</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 10l5 5 5-5z"/>
            </svg>
          </div>
          <div class="dropdown-menu" id="discords-menu">
            <a class="dropdown-item" href="https://discord.gg" target="_blank">Blade Tiers (Official)</a>
            <a class="dropdown-item" href="https://discord.gg" target="_blank">Sword & Mace Combat</a>
            <a class="dropdown-item" href="https://discord.gg" target="_blank">Netherite OP / Pot</a>
            <a class="dropdown-item" href="https://discord.gg" target="_blank">UHC & Axe PvP</a>
            <a class="dropdown-item" href="https://discord.gg" target="_blank">SMP Community</a>
          </div>
        </li>
        <li>
          <a href="#/docs" class="nav-link" id="nav-docs">
            <img src="assets/nav_icons/file_code.svg" alt="API Docs">
            <span>API Docs</span>
          </a>
        </li>
      </ul>

      <div class="nav-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color: var(--text-dim);">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-player-input" placeholder="Search player..." autocomplete="off">
        <kbd class="search-kbd">/</kbd>
        <div class="search-results" id="search-results"></div>
      </div>
    </header>

    <!-- Main Card -->
    <main class="rankings-card">
      <!-- Floating Gamemode Tabs -->
      <nav class="gamemode-tabs" id="gamemode-tabs"></nav>

      <!-- Subheader Controls -->
      <div class="rankings-subheader">
        <div class="subheader-left" id="subheader-left"></div>
        <div class="filters-bar" id="filters-bar"></div>
      </div>

      <!-- Content Area -->
      <div id="main-content"></div>
    </main>

    <!-- Footer -->
    <footer>
      <div>Copyrights © Blade Tiers 2026 • Official Minecraft PvP Leaderboard for chocomc.net</div>
    </footer>
  </div>

  <!-- Player Profile Modal -->
  <div class="modal-overlay" id="player-modal">
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div id="player-modal-body"></div>
    </div>
  </div>

  <!-- Info Modal -->
  <div class="modal-overlay" id="info-modal">
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div id="info-modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
